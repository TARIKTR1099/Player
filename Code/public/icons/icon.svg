<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Music note -->
  <g transform="translate(256,280) rotate(-15)">
    <ellipse cx="0" cy="80" rx="50" ry="30" fill="#0f6cbd" opacity="0.8"/>
    <rect x="-6" y="-120" width="12" height="200" rx="6" fill="#0f6cbd"/>
    <rect x="-6" y="-120" width="80" height="12" rx="6" fill="#0f6cbd"/>
    <rect x="-6" y="-80" width="70" height="12" rx="6" fill="#0f6cbd"/>
  </g>
  <!-- Play triangle -->
  <polygon points="180,160 180,220 230,190" fill="white" opacity="0.9"/>
  <polygon points="370,120 370,180 420,150" fill="white" opacity="0.7"/>
  <circle cx="140" cy="200" r="8" fill="white" opacity="0.3"/>
  <circle cx="400" cy="100" r="5" fill="white" opacity="0.2"/>
</svg>
