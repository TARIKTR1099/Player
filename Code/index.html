  <!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Player — Modern, cross-platform müzik ve medya oynatıcı. AI destekli, görselleştirmeli, eklenti sistemli." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Player" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="modulepreload" href="./src/index.jsx" />
    <title>Player</title>
    <style>
      /* ⚡ Startup skeleton — shows instantly while React loads */
      .skeleton-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #0a0a0f;
        color: rgba(255,255,255,0.5);
      }
      .skeleton-header {
        height: 38px;
        background: rgba(255,255,255,0.03);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        flex-shrink: 0;
      }
      .skeleton-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .skeleton-sidebar {
        width: 52px;
        border-right: 1px solid rgba(255,255,255,0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 0;
        gap: 16px;
        flex-shrink: 0;
      }
      .skeleton-sidebar-item {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
      }
      .skeleton-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 12px;
      }
      .skeleton-line {
        height: 14px;
        border-radius: 4px;
        background: rgba(255,255,255,0.04);
        animation: skeleton-pulse 1.8s ease-in-out infinite;
      }
      .skeleton-line:nth-child(1) { width: 45%; }
      .skeleton-line:nth-child(2) { width: 70%; }
      .skeleton-line:nth-child(3) { width: 55%; }
      .skeleton-line:nth-child(4) { width: 30%; }
      .skeleton-line:nth-child(5) { width: 65%; }
      .skeleton-playerbar {
        height: 112px;
        border-top: 1px solid rgba(255,255,255,0.06);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 32px;
        gap: 16px;
      }
      .skeleton-track {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        flex-shrink: 0;
      }
      .skeleton-track-text {
        flex: 1;
        max-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .skeleton-track-text .skeleton-line { animation: none; background: rgba(255,255,255,0.04); }
      .skeleton-controls {
        display: flex;
        gap: 16px;
        margin: 0 auto;
      }
      .skeleton-btn {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
      }
      .skeleton-btn-play {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
      }
      @keyframes skeleton-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
    </style>
    <script>
      // ⚡ Show skeleton immediately
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="skeleton-root">
            <div class="skeleton-header"></div>
            <div class="skeleton-body">
              <div class="skeleton-sidebar">
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
              </div>
              <div class="skeleton-content">
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
              </div>
            </div>
            <div class="skeleton-playerbar">
              <div class="skeleton-track"></div>
              <div class="skeleton-track-text">
                <div class="skeleton-line" style="width:60%"></div>
                <div class="skeleton-line" style="width:40%"></div>
              </div>
              <div class="skeleton-controls">
                <div class="skeleton-btn"></div>
                <div class="skeleton-btn"></div>
                <div class="skeleton-btn-play"></div>
                <div class="skeleton-btn"></div>
                <div class="skeleton-btn"></div>
              </div>
            </div>
          </div>
        `;
      });
    </script>
    <script>
      // PWA install prompt — captured for later use in Settings
      let deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: true }));
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: false }));
        console.log('PWA: installed successfully');
      });
      // Register service worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(() => console.log('SW: registered'))
            .catch((err) => console.warn('SW: registration failed', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
