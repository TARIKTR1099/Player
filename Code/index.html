  <!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Player — Modern, cross-platform müzik ve medya oynatıcı. AI destekli, görselleştirmeli, eklenti sistemli." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Player" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="./icons/icon.svg" sizes="any" type="image/svg+xml" />
    <title>Player</title>
    <style>
      /* ⚡ Critical: prevent white flash before splash renders */
      html, body { margin: 0; padding: 0; background: #0a0a0f; color: #fff; height: 100%; overflow: hidden; }
      #root { height: 100vh; min-height: 100vh; background: #0a0a0f; }

      /* ⚡ Branded splash screen — shows INSTANTLY before any JS loads */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      #splash-screen.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 192px;
        height: 192px;
        border-radius: 40px;
        background: linear-gradient(135deg, rgba(99,102,241,0.12) 0%, rgba(139,92,246,0.08) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 36px;
        animation: splash-pulse 2.4s ease-in-out infinite;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(99, 102, 241, 0.45);
        border: 1px solid rgba(167, 139, 250, 0.18);
      }
      .splash-logo img,
      .splash-logo svg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      .splash-title {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-subtitle {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255,255,255,0.55);
        margin-bottom: 40px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(139, 92, 246, 0.18);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      .splash-progress {
        margin-top: 22px;
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        min-height: 14px;
        letter-spacing: 0.5px;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-spinner { animation: none; }
      }
    </style>
    <script>
      // ⚡ Render branded splash IMMEDIATELY (synchronous, before <body> parses)
      (function() {
        const splash = document.createElement('div');
        splash.id = 'splash-screen';
        // Use real app icon PNG (PWA-generated, 192x192)
        splash.innerHTML = [
          '<div class="splash-logo"><img src="./icons/icon.svg" alt="Player" onerror="this.onerror=null;this.src=\'./icons/icon-192x192.png\'" /></div>',
          '<div class="splash-title">Player</div>',
          '<div class="splash-subtitle">Y\u00fckleniyor\u2026</div>',
          '<div class="splash-spinner"></div>',
          '<div class="splash-progress" id="splash-progress">v' + (__APP_VERSION__ || '1.0.0') + '</div>',
        ].join('');
        // Append as early as possible — documentElement (html) always exists
        (document.body || document.documentElement).appendChild(splash);
        // Safety: if React never calls __hideSplash (mount failure), show error after 15s
        let safetyTimer = setTimeout(function() {
          const root = document.getElementById('root');
          const isReactMounted = root && root.children.length > 0;
          if (!isReactMounted) {
            var prog = document.getElementById('splash-progress');
            if (prog) {
              prog.style.color = '#fca5a5';
              prog.textContent = '\u26a0 Uygulama y\u00fcklenemedi. Konsolu kontrol edin.';
            }
            // Keep splash visible, don't auto-hide
          } else {
            splash.classList.add('hide');
          }
        }, 15000);
        // Public API: React calls this when first content is rendered
        window.__hideSplash = function() {
          clearTimeout(safetyTimer);
          splash.classList.add('hide');
          // Remove from DOM after transition (avoid lingering z-index)
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        };
      })();
    </script>
    <script>
      // PWA install prompt — captured for later use in Settings
      let deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: true }));
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: false }));
        console.log('PWA: installed successfully');
      });
      // Register service worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(() => console.log('SW: registered'))
            .catch((err) => console.warn('SW: registration failed', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
