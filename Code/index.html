  <!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Player — Modern, cross-platform müzik ve medya oynatıcı. AI destekli, görselleştirmeli, eklenti sistemli." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Player" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="modulepreload" href="./src/index.jsx" />
    <title>Player</title>
    <style>
      /* ⚡ Branded splash screen — shows INSTANTLY before any JS loads */
      html, body { margin: 0; padding: 0; background: #0a0a0f; height: 100%; overflow: hidden; }
      #root { height: 100vh; }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px rgba(139, 92, 246, 0.4);
        margin-bottom: 24px;
        animation: splash-pulse 2.4s ease-in-out infinite;
      }
      .splash-logo svg { width: 56px; height: 56px; }
      .splash-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-subtitle {
        font-size: 12px;
        font-weight: 500;
        color: rgba(255,255,255,0.5);
        margin-bottom: 40px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(139, 92, 246, 0.15);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      .splash-progress {
        margin-top: 20px;
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        min-height: 14px;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(139, 92, 246, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 16px 50px rgba(139, 92, 246, 0.55); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-spinner { animation: none; }
      }

      /* ⚡ Skeleton fallback (after splash fades) */
      .skeleton-root { display: none; }
    </style>
    <script>
      // ⚡ Render branded splash IMMEDIATELY (no DOMContentLoaded — even before HTML parsed)
      (function() {
        const splash = document.createElement('div');
        splash.id = 'splash-screen';
        splash.innerHTML = `
          <div class="splash-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18V5l12-2v13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6" cy="18" r="3" stroke="white" stroke-width="2"/>
              <circle cx="18" cy="16" r="3" stroke="white" stroke-width="2"/>
            </svg>
          </div>
          <div class="splash-title">Player</div>
          <div class="splash-subtitle">Yükleniyor…</div>
          <div class="splash-spinner"></div>
          <div class="splash-progress" id="splash-progress">v1.0.0</div>
        `;
        // Insert as first child of body when body exists, else wait
        const insert = () => {
          if (document.body) {
            document.body.insertBefore(splash, document.body.firstChild);
          } else {
            document.addEventListener('DOMContentLoaded', insert, { once: true });
          }
        };
        insert();
        // Safety: hide after 10s no matter what (avoid stuck splash on error)
        setTimeout(() => splash.classList.add('hide'), 10000);
        // Expose hide function for React to call when ready
        window.__hideSplash = () => splash.classList.add('hide');
      })();
    </script>
    <script>
      // PWA install prompt — captured for later use in Settings
      let deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: true }));
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        document.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: false }));
        console.log('PWA: installed successfully');
      });
      // Register service worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(() => console.log('SW: registered'))
            .catch((err) => console.warn('SW: registration failed', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
