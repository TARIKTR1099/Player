# Player — Cross-Platform Release Pipeline
# Triggers on version tag push (v*) or manual dispatch.
# Builds Windows (local) + Linux (AppImage) + macOS (DMG, unsigned)
# via GitHub Actions. iOS/Android built locally — see mobile/BUILD.md.
#
# The release job aggregates Windows (local) + Linux (GH) + macOS (GH)
# assets and publishes to a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Linux — AppImage / deb / rpm (easiest to build on GitHub)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux (AppImage / deb / rpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 \
            fakeroot rpm
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Build electron (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --linux --x64 --publish never
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-linux
          path: |
            dist/Player-*.AppImage
            dist/Player-*.deb
            dist/Player-*.rpm

  # ------------------------------------------------------------------
  # macOS — DMG (unsigned, Intel + Apple Silicon)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS (DMG, x64 + arm64, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Build electron (macOS x64 + arm64, unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder --mac --x64 --arm64 --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-macos
          path: |
            dist/Player-*.dmg
            dist/Player-*-mac-*.zip

  # ------------------------------------------------------------------
  # Source bundle (zip + tar.gz, re-runnable on any runner)
  # ------------------------------------------------------------------
  build-source:
    name: Build source bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Create source bundle
        run: node Scripts/create-source-bundle.js
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: player-source
          path: |
            dist/Player-*-source.zip
            dist/Player-*-source.tar.gz
