# Player — Cross-Platform Release Pipeline
# Builds Windows / Linux / macOS installers + Android APK + iOS archive,
# publishes all to a single GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Default to "continue on error" so a single platform failure does not
# cancel the whole matrix. Each job's artifacts are best-effort.
defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------
  # 0. Resolve version (read from package.json)
  # ------------------------------------------------------------------
  resolve-version:
    name: 🔖 Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "v=$VER" >> $GITHUB_OUTPUT
          echo "Resolved version: $VER"

  # ------------------------------------------------------------------
  # 1. Windows — NSIS Setup + portable
  # ------------------------------------------------------------------
  build-windows:
    name: 🪟 Windows (NSIS + portable)
    runs-on: windows-latest
    needs: resolve-version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build-web
      - name: Build NSIS Setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win nsis --x64
      - name: Build portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: player-windows
          if-no-files-found: warn
          path: |
            dist/Player-${{ needs.resolve-version.outputs.version }}-setup-x64.exe
            dist/Player-${{ needs.resolve-version.outputs.version }}-portable-x64.exe
            dist/Player-${{ needs.resolve-version.outputs.version }}-x64.exe
            dist/latest.yml

  # ------------------------------------------------------------------
  # 2. macOS — DMG (x64 + arm64)
  # ------------------------------------------------------------------
  build-macos:
    name: 🍎 macOS (DMG x64 + arm64)
    runs-on: macos-latest
    needs: resolve-version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build-web
      - name: Build DMG (x64 + arm64, unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac --x64 --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: player-macos
          if-no-files-found: warn
          path: |
            dist/Player-*.dmg
            dist/Player-*-mac-*.zip
            dist/latest-mac.yml

  # ------------------------------------------------------------------
  # 3. Linux — AppImage, deb, rpm
  # ------------------------------------------------------------------
  build-linux:
    name: 🐧 Linux (AppImage / deb / rpm)
    runs-on: ubuntu-22.04
    needs: resolve-version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 \
            libxshmfence1 libdrm2 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libnss3 libxext6 fakeroot rpm
      - run: npm ci
      - run: npm run build-web
      - name: Build Linux installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux --x64
      - uses: actions/upload-artifact@v4
        with:
          name: player-linux
          if-no-files-found: warn
          path: |
            dist/Player-*.AppImage
            dist/Player-*.deb
            dist/Player-*.rpm
            dist/latest-linux.yml

  # ------------------------------------------------------------------
  # 4. Android — APK via Capacitor (uses debug signing for CI builds)
  # ------------------------------------------------------------------
  build-android:
    name: 🤖 Android (APK)
    runs-on: ubuntu-22.04
    needs: resolve-version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build-web
      - name: Install Capacitor deps
        run: cd mobile && npm ci
      - name: Sync Capacitor Android
        run: cd mobile && npx cap sync android
      - name: Generate debug keystore (for unsigned CI builds)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Android Release APK (debug-signed)
        run: |
          cd mobile/android
          # Ensure release build type uses debug signing for CI
          ./gradlew --no-daemon assembleRelease
      - name: Locate APK
        id: find_apk
        run: |
          VER=${{ needs.resolve-version.outputs.version }}
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "player-${VER}.apk"
            echo "apk_path=player-${VER}.apk" >> $GITHUB_OUTPUT
          else
            echo "::warning::No APK found"
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: player-android
          if-no-files-found: warn
          path: player-${{ needs.resolve-version.outputs.version }}.apk

  # ------------------------------------------------------------------
  # 5. iOS — xcodebuild archive (best-effort, unsigned)
  # ------------------------------------------------------------------
  build-ios:
    name: 🍎 iOS (xcodebuild archive, best-effort)
    runs-on: macos-latest
    needs: resolve-version
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build-web
      - name: Install Capacitor deps
        run: cd mobile && npm ci
      - name: Add iOS platform (skip if exists)
        run: |
          cd mobile
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor iOS
        run: cd mobile && npx cap sync ios || true
      - name: Build iOS archive (unsigned)
        run: |
          cd mobile/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Player.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            archive || true
      - name: Package archive (no signing)
        run: |
          VER=${{ needs.resolve-version.outputs.version }}
          cd $RUNNER_TEMP
          if [ -d Player.xcarchive ]; then
            zip -r "$GITHUB_WORKSPACE/player-${VER}-ios-unsigned.zip" Player.xcarchive
          else
            # Fallback: zip the mobile/ios/App dir
            cd "$GITHUB_WORKSPACE/mobile/ios/App"
            zip -r "$GITHUB_WORKSPACE/player-${VER}-ios-unsigned.zip" . -x "Pods/*" -x "build/*"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: player-ios
          if-no-files-found: warn
          path: player-${{ needs.resolve-version.outputs.version }}-ios-unsigned.zip

  # ------------------------------------------------------------------
  # 6. Source bundle (always succeeds)
  # ------------------------------------------------------------------
  build-source:
    name: 📦 Source bundle
    runs-on: ubuntu-22.04
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node Scripts/create-source-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: player-source
          path: |
            Player-${{ needs.resolve-version.outputs.version }}-source.zip
            Player-${{ needs.resolve-version.outputs.version }}-source.tar.gz

  # ------------------------------------------------------------------
  # 7. Final — collect artifacts & publish
  # ------------------------------------------------------------------
  release:
    name: 📤 Publish Release
    needs:
      - resolve-version
      - build-windows
      - build-macos
      - build-linux
      - build-android
      - build-ios
      - build-source
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all collected artifacts
        if: always()
        run: |
          echo "=== Collected artifacts ==="
          find release-artifacts -type f 2>/dev/null | head -100 || true
          echo "=== End of list ==="

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
