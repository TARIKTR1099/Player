# Player — Cross-Platform Release Pipeline
# Triggers on version tag push (v*) or manual dispatch.
# Builds Windows / macOS / Linux installers + Android APK + iOS archive,
# then uploads everything to a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. Windows — NSIS + portable + zip installers
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows (NSIS / portable / zip)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Build electron (NSIS + portable + zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win --x64
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-windows
          path: |
            dist/Player-*.exe
            dist/Player-*.zip
            dist/latest.yml

  # ------------------------------------------------------------------
  # 2. macOS — DMG + zip (Intel + Apple Silicon)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS (DMG / zip, x64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Build electron (macOS x64 + arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac --x64 --arm64
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-macos
          path: |
            dist/Player-*.dmg
            dist/Player-*-mac-*.zip

  # ------------------------------------------------------------------
  # 3. Linux — AppImage, deb, rpm
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux (AppImage / deb / rpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 \
            fakeroot rpm
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Build electron (Linux AppImage + deb + rpm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux --x64
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-linux
          path: |
            dist/Player-*.AppImage
            dist/Player-*.deb
            dist/Player-*.rpm

  # ------------------------------------------------------------------
  # 4. Android — APK (Capacitor)
  # ------------------------------------------------------------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Sync Capacitor Android
        run: cd mobile && npx cap sync android && cd ..
      - name: Build Android APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-android
          path: ${{ steps.find_apk.outputs.apk_path }}

  # ------------------------------------------------------------------
  # 5. iOS — xcodebuild archive
  # ------------------------------------------------------------------
  build-ios:
    name: Build iOS (xcodebuild archive)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build-web
      - name: Sync Capacitor iOS
        run: cd mobile && npx cap sync ios && cd ..
      - name: Build iOS archive
        run: |
          cd mobile/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Player.xcarchive \
            -destination 'generic/platform=iOS' \
            archive
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-ios
          path: $RUNNER_TEMP/Player.xcarchive

  # ------------------------------------------------------------------
  # 6. Final — collect all artifacts & publish to GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List all artifacts
        run: |
          echo "=== Collected artifacts ==="
          find release-artifacts -type f -exec ls -lh {} \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.apk
            release-artifacts/**/*.xcarchive/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
